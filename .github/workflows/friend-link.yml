name: Friend Link

# 友链申请自动化：
#   opened            → 自动检查（可达性 / 反链）并回评
#   labeled(approved) → 自动合并到 src/data/friends.json 并触发部署
on:
    issues:
        types: [opened, labeled]

permissions:
    contents: write
    issues: write
    actions: write

concurrency:
    group: friend-link-${{ github.event.issue.number }}
    cancel-in-progress: false

jobs:
    validate:
        if: >-
            github.event.action == 'opened' &&
            contains(github.event.issue.labels.*.name, 'friend-link')
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Validate submission and comment
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  ISSUE_NUMBER: ${{ github.event.issue.number }}
                  ISSUE_BODY: ${{ github.event.issue.body }}
              run: node .github/scripts/friend-link.mjs validate

    merge:
        if: >-
            github.event.action == 'labeled' &&
            github.event.label.name == 'approved' &&
            contains(github.event.issue.labels.*.name, 'friend-link')
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  ref: main

            - name: Merge approved submission
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  ISSUE_NUMBER: ${{ github.event.issue.number }}
                  ISSUE_BODY: ${{ github.event.issue.body }}
              run: node .github/scripts/friend-link.mjs merge

            - name: Commit, push and trigger deploy
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  if git diff --quiet -- src/data/friends.json; then
                      echo "friends.json 无变化，跳过提交（可能为重复申请）"
                  else
                      git add src/data/friends.json
                      git commit -m "chore: add friend link (issue #${{ github.event.issue.number }})"
                      git push
                      # GITHUB_TOKEN 触发的 push 不会自动触发其它工作流，手动派发一次部署
                      gh workflow run deploy.yml --ref main
                  fi
