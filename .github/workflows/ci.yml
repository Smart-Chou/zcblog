name: CI

on:
    push:
        branches: [main, theme]
    pull_request:
        branches: [main, theme]

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
                          
            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: latest

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install

            - name: Lint
              run: pnpm run lint

            - name: Run TypeScript check
              run: pnpm type-check

            - name: Run unit tests
              run: pnpm test:unit

            - name: Run E2E tests (if configured)
              run: |
                  if [ -f "playwright.config.ts" ] || [ -f "playwright.config.js" ]; then
                    pnpm test:e2e
                  else
                    echo "No Playwright config found, skipping E2E tests"
                  fi

            - name: Build project
              env:
                  CI: true
                  BLINKO_API_TOKEN: ${{ secrets.BLINKO_API_TOKEN }}
                  DOUBAN_USER_ID: ${{ secrets.DOUBAN_USER_ID }}
                  ENCRYPTION_PASSWORD: ${{ secrets.ENCRYPTION_PASSWORD }}
                  FOREVERBLOG_RSS_URL: ${{ secrets.FOREVERBLOG_RSS_URL }}
                  BUILD_CONCURRENCY: 1
              run: pnpm build

            - name: Link check
              run: node scripts/link-check.mjs dist || echo "Link check completed with warnings"

            - name: Upload build artifacts (on failure for debugging)
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: build-output
                  path: dist/
                  retention-days: 7
