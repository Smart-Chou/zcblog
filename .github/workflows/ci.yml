name: CI

on:
    push:
        branches: [main, theme]
    pull_request:
        branches: [main, theme]

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: "24"
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm run lint

            - name: Run TypeScript check
              run: pnpm type-check

            - name: Run unit tests
              run: pnpm test:unit
