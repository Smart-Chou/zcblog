name: CI

on:
    push:
        branches: [main, theme]
    pull_request:
        branches: [main, theme]

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm run lint

            - name: Run TypeScript check
              run: pnpm type-check

            - name: Run unit tests
              run: pnpm test:unit

            - name: Build project
              env:
                  CI: true
                  BLINKO_API_TOKEN: ${{ secrets.BLINKO_API_TOKEN }}
                  DOUBAN_USER_ID: ${{ secrets.DOUBAN_USER_ID }}
                  ENCRYPTION_PASSWORD: ${{ secrets.ENCRYPTION_PASSWORD }}
                  FOREVERBLOG_RSS_URL: ${{ secrets.FOREVERBLOG_RSS_URL }}
                  BUILD_CONCURRENCY: 1
              run: pnpm build

            - name: Check E2E config
              id: check_e2e_config
              run: |
                  if [ -f "playwright.config.ts" ] || [ -f "playwright.config.js" ]; then
                    echo "has_config=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "has_config=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Install Playwright browsers
              if: steps.check_e2e_config.outputs.has_config == 'true'
              run: pnpm exec playwright install --with-deps chromium

            - name: Run E2E tests
              if: steps.check_e2e_config.outputs.has_config == 'true'
              run: pnpm test:e2e

            - name: Upload build artifacts (on failure for debugging)
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: build-output
                  path: dist/
                  retention-days: 7
