name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "pnpm"

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: latest

            - name: Install dependencies
              run: pnpm install

            - name: Run TypeScript check
              run: pnpm astro check

            - name: Run unit tests
              run: pnpm test:unit

            - name: Run E2E tests (if configured)
              run: |
                  if [ -f "playwright.config.ts" ] || [ -f "playwright.config.js" ]; then
                    pnpm test:e2e
                  else
                    echo "No Playwright config found, skipping E2E tests"
                  fi

            - name: Build project
              run: pnpm build

            - name: Upload build artifacts (on failure for debugging)
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: build-output
                  path: dist/
                  retention-days: 7
