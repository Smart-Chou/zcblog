name: Deploy blog

on:
  push:
    branches:
      - main

jobs:
  deploy-gh-pages:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install
        env:
          PNPM_HOME: ~/.pnpm-store

      - name: Build
        run: pnpm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAGE_GITHUB_TOKEN }}
          external_repository: Smart-Chou/smart-chou.github.io
          publish_branch: main
          publish_dir: dist
          cname: marxchou.com
          force_orphan: true

  test_website:
    needs: deploy-gh-pages
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - name: Test website connectivity
        run: |
          echo "Pinging marxchou.com..."
          ping -c 4 marxchou.com || echo "Ping failed, but continuing..."
          echo "Testing https://marxchou.com"
          curl -v https://marxchou.com --connect-timeout 10 || echo "Request failed, but continuing..."
          echo "Testing Meilisearch health"
          curl -v https://meilisearch.marxchou.com/health --connect-timeout 10 || echo "Request failed, but continuing..."

  scrape-docs:
    needs: test_website
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Run docs-scraper in Docker
        env:
          MEILISEARCH_HOST_URL: ${{ secrets.MEILISEARCH_HOST_URL }}
          MEILISEARCH_API_KEY: ${{ secrets.MEILISEARCH_API_KEY }}
          CONFIG_FILE_PATH: ${{ github.workspace }}/public/docs-scraper.json
        run: |
          docker run --rm -t \
            --network=host \
            -e MEILISEARCH_HOST_URL=$MEILISEARCH_HOST_URL \
            -e MEILISEARCH_API_KEY=$MEILISEARCH_API_KEY \
            -v $CONFIG_FILE_PATH:/docs-scraper/config.json \
            getmeili/docs-scraper:v0.12.12 pipenv run ./docs_scraper config.json
