name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Debug info
        run: |
          node --version
          pnpm --version
          npx astro --version
          pnpm list sharp
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libvips-dev
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Show directory structure
        run: |
          pwd
          ls -la
          ls -la src/
      - name: Lint code
        run: pnpm run lint || echo "Lint not configured, skipping"
      - name: Build
        env:
          CI: true
        run: pnpm run build --verbose
      - name: Validate build
        run: |
          if [ -d dist ]; then
            echo "dist directory contents:"
            ls -la dist
            echo "Checking for index.html..."
            test -f dist/index.html && echo "index.html found" || { echo "index.html missing"; exit 1; }
          else
            echo "ERROR: dist directory not found. Build likely failed."
            exit 1
          fi
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with: 
          personal_token: ${{ secrets.PAGE_GITHUB_TOKEN }}
          external_repository: Smart-Chou/smart-chou.github.io
          publish_branch: main
          publish_dir: dist
          cname: marxchou.com
          force_orphan: true