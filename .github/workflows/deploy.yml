name: Deploy

on:
    push:
        branches: [main, theme]

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: true
                  fetch-depth: 0

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: latest

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install system dependencies
              run: sudo apt-get update && sudo apt-get install -y libvips-dev

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Debug info
              run: |
                  node --version
                  pnpm --version
                  npx astro --version
                  pnpm list sharp

            - name: Show directory structure
              run: |
                  pwd
                  ls -la
                  ls -la src/

            - name: Lint code
              run: pnpm run lint

            - name: Auto version bump
              if: github.ref == 'refs/heads/main'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  npx standard-version --releaseCommitMessageFormat "chore(release): {{currentTag}} [skip ci]" || echo "No version bump needed"
                  git push --follow-tags origin main || echo "No changes to push"

            - name: Build
              env:
                  CI: true
                  BLINKO_API_TOKEN: ${{ secrets.BLINKO_API_TOKEN }}
                  DOUBAN_USER_ID: ${{ secrets.DOUBAN_USER_ID }}
                  ENCRYPTION_PASSWORD: ${{ secrets.ENCRYPTION_PASSWORD }}
                  FOREVERBLOG_RSS_URL: ${{ secrets.FOREVERBLOG_RSS_URL }}
                  BUILD_CONCURRENCY: 1
              run: pnpm run build --verbose

            - name: Validate build
              run: |
                  if [ -d dist ]; then
                    echo "dist directory contents:"
                    ls -la dist
                    echo "Checking for index.html..."
                    test -f dist/index.html && echo "index.html found" || { echo "index.html missing"; exit 1; }
                  else
                    echo "ERROR: dist directory not found. Build likely failed."
                    exit 1
                  fi

            - name: Deploy (main → marxchou.com)
              if: github.ref == 'refs/heads/main'
              uses: peaceiris/actions-gh-pages@v4
              with:
                  personal_token: ${{ secrets.PAGE_GITHUB_TOKEN }}
                  external_repository: Smart-Chou/smart-chou.github.io
                  publish_branch: main
                  publish_dir: dist
                  cname: marxchou.com
                  force_orphan: true

            - name: Deploy (theme → theme.marxchou.com)
              if: github.ref == 'refs/heads/theme'
              uses: peaceiris/actions-gh-pages@v4
              with:
                  personal_token: ${{ secrets.PAGE_GITHUB_TOKEN }}
                  external_repository: Smart-Chou/smart-chou.github.io
                  publish_branch: theme
                  publish_dir: dist
                  cname: theme.marxchou.com
                  force_orphan: true
