name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint code
        run: pnpm run lint || echo "Lint not configured, skipping"
      - name: Build
        run: pnpm run build
      - name: Validate build
        run: ls dist && test -f dist/index.html
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with: 
          personal_token: ${{ secrets.PAGE_GITHUB_TOKEN }}
          external_repository: Smart-Chou/smart-chou.github.io
          publish_branch: main
          publish_dir: dist
          cname: marxchou.com
          force_orphan: true