name: Deploy

on:
    push:
        branches: [main, theme]
    repository_dispatch:
        types: [articles-updated]
    workflow_dispatch:
    # 每日自动重建（cron 为 UTC：21:30 = 北京时间 05:30），刷新热门文章等构建期抓取的数据。
    # 注意：GitHub 会在仓库连续 60 天无活动后自动暂停 schedule，发生一次 push 即恢复。
    schedule:
        - cron: "30 21 * * *"

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: deploy-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Checkout zcblog
              uses: actions/checkout@v5

            - name: Checkout articles (private)
              uses: actions/checkout@v5
              with:
                  repository: Smart-Chou/zcblog-articles
                  path: _articles
                  token: ${{ secrets.ARTICLES_PAT }}

            - name: Copy articles and images
              run: |
                  mkdir -p src/content/article
                  cp _articles/*.md src/content/article/ 2>/dev/null || true
                  cp _articles/*.mdx src/content/article/ 2>/dev/null || true
                  echo "📄 $(ls src/content/article/*.md src/content/article/*.mdx 2>/dev/null | wc -l) 篇文章"

                  mkdir -p src/assets
                  cp -r _articles/assets/* src/assets/ 2>/dev/null || true
                  echo "🖼  $(find src/assets -type f 2>/dev/null | wc -l) 张图片"

            - name: Install system dependencies
              run: sudo apt-get update && sudo apt-get install -y libvips-dev

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              env:
                  CI: true
                  ARTICLE_REPO_PATH: _articles
                  BLINKO_API_URL: https://memos.marxchou.com
                  BLINKO_API_TOKEN: ${{ secrets.BLINKO_API_TOKEN }}
                  UMAMI_API_URL: https://umami.marxchou.com
                  UMAMI_WEBSITE_ID: 73b29141-fccf-4d54-9c2f-f7d0d146f86b
                  UMAMI_USERNAME: ${{ secrets.UMAMI_USERNAME }}
                  UMAMI_PASSWORD: ${{ secrets.UMAMI_PASSWORD }}
                  UMAMI_SHARE_SLUG: EIlCDPZqKiANCpuO
                  BANGUMI_USER_ID: "1246668"
                  DOUBAN_USER_ID: ${{ secrets.DOUBAN_USER_ID }}
                  ENCRYPTION_PASSWORD: ${{ secrets.ENCRYPTION_PASSWORD }}
                  FOREVERBLOG_RSS_URL: ${{ secrets.FOREVERBLOG_RSS_URL }}
                  BUILD_CONCURRENCY: 1
              run: pnpm run build

            # ---- S4 门禁：把验收标准变成机器（失败即中断部署）----
            - name: Verify build (A1 / A11 / A13 + pagefind)
              run: node scripts/verify-build.mjs

            - name: Content checks (A2 遗留字段 / A3 相对图)
              run: |
                  python3 scripts/gates/check-legacy-keys.py src/content/article
                  python3 scripts/gates/check-relative-assets.py src/content/article --verify . --expect 22

            - name: Performance budget (A6)
              run: python3 scripts/gates/perf-budget.py dist

            - name: Lint (prettier --check)
              run: pnpm run lint

            # main 分支 → GitHub Pages 原生部署
            - name: Upload Pages artifact
              if: github.ref == 'refs/heads/main'
              uses: actions/upload-pages-artifact@v3
              with:
                  path: dist

            - name: Deploy to GitHub Pages
              if: github.ref == 'refs/heads/main'
              id: deployment
              uses: actions/deploy-pages@v4

            # SEO 主动推送（IndexNow + 可选百度）：部署完成后提交新/更新文章 URL；
            # 未配置 INDEXNOW_KEY / BAIDU_TOKEN 时脚本自动跳过；失败不影响部署
            - name: Submit to IndexNow
              if: github.ref == 'refs/heads/main'
              env:
                  INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
                  BAIDU_TOKEN: ${{ secrets.BAIDU_TOKEN }}
              run: node scripts/indexnow-submit.mjs || echo "⚠️ IndexNow 提交失败（不影响部署）"

            # 清 Cloudflare 边缘缓存（D-0047）：HTML 现为 edge 300s，不发 purge 的话
            # 发版后最多 5 分钟读者仍看到旧页。未配置 CF_ZONE_ID / CF_PURGE_TOKEN 时跳过。
            - name: Purge Cloudflare cache
              if: github.ref == 'refs/heads/main'
              env:
                  CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
                  CF_PURGE_TOKEN: ${{ secrets.CF_PURGE_TOKEN }}
              run: |
                  if [ -z "$CF_ZONE_ID" ] || [ -z "$CF_PURGE_TOKEN" ]; then
                    echo "⚠️ 未配置 CF_ZONE_ID / CF_PURGE_TOKEN，跳过 purge"
                    exit 0
                  fi
                  code=$(curl -s -o /tmp/purge.json -w '%{http_code}' -X POST \
                    "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
                    -H "Authorization: Bearer $CF_PURGE_TOKEN" \
                    -H "Content-Type: application/json" \
                    -d '{"purge_everything":true}')
                  cat /tmp/purge.json
                  if [ "$code" != "200" ]; then
                    echo "⚠️ purge 失败 HTTP $code（不影响部署，最坏 5 分钟后自动过期）"
                  fi
