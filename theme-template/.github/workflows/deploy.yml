name: Deploy

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              env:
                  CI: true
                  BUILD_CONCURRENCY: 1
                  # 如需自动抓取数据源（可选），在仓库 Secrets 中配置后取消注释：
                  # BLINKO_API_URL: ${{ secrets.BLINKO_API_URL }}
                  # BLINKO_API_TOKEN: ${{ secrets.BLINKO_API_TOKEN }}
                  # DOUBAN_USER_ID: ${{ secrets.DOUBAN_USER_ID }}
                  # BANGUMI_USER_ID: ${{ secrets.BANGUMI_USER_ID }}
                  # ENCRYPTION_PASSWORD: ${{ secrets.ENCRYPTION_PASSWORD }}
              run: pnpm build

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: dist

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
